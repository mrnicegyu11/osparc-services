settings:
  - name: "ports"
    type: "int"
    value:
      80
  - name: "constraints"
    type: "string"
    value:
      - node.platform.os == linux
  - name: "resources"
    type: "resources"
    value:
      Limits: {'NanoCPUs': 4000000000, 'MemoryBytes': 17179869184}
      Reservations: {'NanoCPUs': 100000000, 'MemoryBytes': 536870912}
paths-mapping: # Watch this carefully and potentially adjust
  outputs_path: "/home/scu/output"
  inputs_path: "/data"
  state_paths: []
compose-spec:
  version: "3.7"
  services:
    3d-viewer:
      image: $${SIMCORE_REGISTRY}/simcore/services/dynamic/3d-viewer:$${SERVICE_VERSION}
      environment:
container-http-entrypoint: 3d-viewer
